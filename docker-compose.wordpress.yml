services:
  wordpress-db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?Copy .env.wordpress.example to .env.wordpress first}
      MARIADB_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD:?Copy .env.wordpress.example to .env.wordpress first}
    volumes:
      - wordpress-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:6.8-php8.3-apache
    restart: unless-stopped
    depends_on:
      wordpress-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    environment:
      WORDPRESS_DB_HOST: wordpress-db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?Copy .env.wordpress.example to .env.wordpress first}
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
    volumes:
      - wordpress-content:/var/www/html/wp-content
      - ./wordpress/plugins/cshk-content-catalog/cshk-content-catalog.php:/var/www/html/wp-content/mu-plugins/cshk-content-catalog.php:ro
      - ./wordpress/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro

volumes:
  wordpress-db:
  wordpress-content:
